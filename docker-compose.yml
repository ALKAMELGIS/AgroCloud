
version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # SQLite: one file in the agrocloud_data volume (no database server needed).
      # Identity/RBAC is opt-in: AGROCLOUD_IDENTITY=on
      - AGROCLOUD_DATA_DIR=/var/lib/agrocloud
      - TITILER_URL=http://titiler:8000
      - IMAGE_CLASSIFICATION_URL=http://image-classification:8000
    depends_on:
      - titiler
      - image-classification
    volumes:
      - .:/app
      - /app/node_modules
      - ./backend/uploads/rasters:/app/backend/uploads/rasters
      - raster_tile_cache:/app/backend/cache/tiles
      - agrocloud_data:/var/lib/agrocloud

  # Dynamic COG tiling (EPSG:3857 XYZ). Express proxies /api/raster/:id/tiles → TiTiler.
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8001:8000"
    environment:
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff,.vrt,.nc,.hdf,.h5
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_CACHEMAX=512
    volumes:
      - ./backend/uploads/rasters:/data:ro

  # Image Classification Wizard ML service (FastAPI). Owns segmentation/train/classify
  # logic plus JP2/JPEG2000 → GeoTIFF conversion (rasterio/GDAL). Needs read-write on the
  # uploads volume so it can write the converted cog.tif back next to the source raster.
  image-classification:
    build: ./backend/services/image-classification
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
    # Bind-mount (not a named volume) so host-run Node and this container share the exact
    # same raster files — the JP2→GeoTIFF conversion writes cog.tif back here for the tiler.
    volumes:
      - ./backend/uploads/rasters:/data
    restart: unless-stopped

  # Agri Field Boundary (FoW / FTW infer / FTW live / SEN2SR) — FastAPI on :8092.
  # Local Windows without Docker: backend/services/agri-field-boundary/start-local.ps1
  agri-field-boundary:
    build: ./backend/services/agri-field-boundary
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - FTW_INFER_ENABLED=1
    restart: unless-stopped

volumes:
  agrocloud_data:
  raster_tile_cache:
