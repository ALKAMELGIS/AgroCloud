# Production stack for Hostinger VPS (2.24.11.216).
# Build contexts use the GitHub repo so Hostinger Docker Manager does not need a full checkout.
#
# Deploy:
#   Hostinger MCP → VPS_createNewProjectV1
#   content: https://raw.githubusercontent.com/ALKAMELGIS/AgroCloud/main/docker-compose.vps.yml

services:
  agri-field-boundary:
    build:
      context: https://github.com/ALKAMELGIS/AgroCloud.git#main:backend/services/agri-field-boundary
      dockerfile: Dockerfile
      args:
        CACHE_BUST: '2026-09-01-ftw-gpu-fix'
    environment:
      PORT: '8092'
      FTW_INFER_ENABLED: '1'
      FTW_INFER_MODEL: 'FTW_PRUE_EFNET_B7'
      FTW_CHECKPOINT_PATH: '/app/models/prue_efnetb7_ccby_checkpoint.ckpt'
      FTW_INFER_BATCH_SIZE: '1'
      FTW_INFER_NUM_WORKERS: '1'
      FTW_INFERENCE_TIMEOUT_SEC: '1800'
    volumes:
      - agri_ftw_models:/app/models
    expose:
      - '8092'
    restart: unless-stopped

  app:
    build:
      context: https://github.com/ALKAMELGIS/AgroCloud.git#main
      dockerfile: Dockerfile
      args:
        CACHE_BUST: '2026-09-01-ftw-gpu-fix'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      FIELD_BOUNDARY_URL: http://agri-field-boundary:8092/detect
      VITE_ELITE_SAME_ORIGIN_API: 'true'
    expose:
      - '3001'
    depends_on:
      - agri-field-boundary
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        eliteagrocloud.com, www.eliteagrocloud.com, api.eliteagrocloud.com {
          encode gzip zstd
          reverse_proxy app:3001
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - app
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  agri_ftw_models:
