name: Deploy full-stack to VPS

# Builds SPA + restarts Node on VPS when VPS_* secrets are configured.
# Global FTW (PMTiles) works from GitHub Pages without this — use this for unified-domain cutover.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/deploy-vps-fullstack.sh'
      - 'scripts/nginx-eliteagrocloud-vps.conf.example'
      - '.github/workflows/deploy-vps-fullstack.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps-fullstack
  cancel-in-progress: true

jobs:
  # `secrets` cannot be used in a job-level `if` (GitHub rejects the whole workflow file), so check
  # for the SSH secrets in a step and gate the deploy job on the result.
  ssh-configured:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::VPS_HOST / VPS_SSH_KEY not set — SSH deploy skipped."; fi

  deploy:
    needs: ssh-configured
    if: needs.ssh-configured.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/AgroCloud' }}"
            export DEPLOY_PATH
            export BRANCH=main
            if [[ -x "$DEPLOY_PATH/scripts/deploy-vps-fullstack.sh" ]]; then
              "$DEPLOY_PATH/scripts/deploy-vps-fullstack.sh"
            else
              mkdir -p "$DEPLOY_PATH"
              git clone --depth 1 -b main "https://github.com/${{ github.repository }}.git" "$DEPLOY_PATH" 2>/dev/null || true
              cd "$DEPLOY_PATH" && git pull --ff-only origin main
              chmod +x scripts/deploy-vps-fullstack.sh
              ./scripts/deploy-vps-fullstack.sh
            fi

      - name: Smoke HTTPS /api/health (optional)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            curl -fsS -k "https://127.0.0.1/api/health" -H "Host: www.eliteagrocloud.com" | grep -q '"ok"' || true
