name: Deploy agri-field-boundary to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/agri-field-boundary/**'
      - 'backend/server/proxies/agriFieldBoundaryProxy.js'
      - 'backend/server/engines/fieldBoundaryBuiltin.js'
      - '.github/workflows/deploy-agri-field-boundary-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agri-field-boundary-vps
  cancel-in-progress: true

jobs:
  # `secrets` cannot be used in a job-level `if` (GitHub rejects the whole workflow file), so check
  # for the SSH secrets in a step and gate the deploy job on the result.
  ssh-configured:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::VPS_HOST / VPS_SSH_KEY not set — SSH deploy skipped."; fi

  deploy:
    needs: ssh-configured
    if: needs.ssh-configured.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/AgroCloud' }}"
            cd "$DEPLOY_PATH/backend/services/agri-field-boundary"
            chmod +x start-vps.sh
            AFB_GIT_PULL=1 AFB_USE_SYSTEMD=1 ./start-vps.sh

      - name: Smoke /health/live + /health/ready
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            PORT="${{ secrets.AFB_PORT || '8092' }}"
            curl -fsS "http://127.0.0.1:${PORT}/health/live" | grep -q '"live"'
            curl -fsS "http://127.0.0.1:${PORT}/health/ready" | grep -q '"ready"'
            # When AFD weights are present, health should report the engine flag.
            if [[ -f /opt/AgroCloud/backend/services/agri-field-boundary/models/AgriculturalFieldDelineation/AgricultureFieldDelination.pth ]]; then
              curl -fsS "http://127.0.0.1:${PORT}/health" | grep -q 'agricultural_field_delineation'
            fi
