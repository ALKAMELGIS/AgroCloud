name: Deploy agri-field-boundary to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/agri-field-boundary/**'
      - 'backend/server/agriFieldBoundaryProxy.js'
      - 'backend/server/fieldBoundaryBuiltin.js'
      - 'scripts/vps-*.sh'
      - '.github/workflows/deploy-agri-field-boundary-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agri-field-boundary-vps
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/AgroCloud' }}"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              apt-get update -qq
              apt-get install -y -qq git curl openssh-server python3.12 python3.12-venv python3-pip build-essential libgdal-dev gdal-bin
              systemctl enable --now ssh || true
              git clone --depth 1 https://github.com/ALKAMELGIS/AgroCloud.git "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH/backend/services/agri-field-boundary"
            git -C "$DEPLOY_PATH" pull --ff-only origin main || true
            chmod +x start-vps.sh
            cp agri-field-boundary.service /etc/systemd/system/agri-field-boundary.service
            systemctl daemon-reload
            systemctl enable agri-field-boundary
            export FTW_INFER_ENABLED=1
            AFB_GIT_PULL=0 AFB_USE_SYSTEMD=1 ./start-vps.sh
            command -v ufw >/dev/null && ufw allow 8092/tcp && ufw reload || true
            ss -lntp | grep 8092

      - name: Smoke /health/live + /health/ready
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            PORT="${{ secrets.AFB_PORT || '8092' }}"
            curl -fsS "http://127.0.0.1:${PORT}/health/live" | grep -q '"live"'
            curl -fsS "http://127.0.0.1:${PORT}/health/ready" | grep -q '"ready"'
