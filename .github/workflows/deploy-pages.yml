name: Deploy to GitHub Pages

# CI builds the SPA with empty public env vars (base "/" for the custom domain), publishes frontend/dist
# to docs/ on main, then pushes [pages-sync]. GitHub Pages: Deploy from a branch → main → /docs
# (GitHub only allows "/" or "/docs" for branch publishing).
# Live app (HashRouter): https://www.eliteagrocloud.com/#/
#
# Order is what keeps the site up: publish docs/ → push → point Pages at /docs → only then remove the
# legacy build that older deploys left in the repo root (one-time; no-op afterwards).
#
# docs/ is gitignored — never commit it from a local machine (a local .env would embed secrets).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  # New push supersedes an in-flight deploy so the latest code reaches Pages sooner (safe: each run is a full build + one commit).
  cancel-in-progress: true

jobs:
  publish-to-main-root:
    # Skip only the automated root sync commit from this workflow (avoids infinite loop). Do not skip user commits that merely mention [pages-sync] in the message body.
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(pages): ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build SPA for GitHub Pages (no local .env — safe for push protection)
        env:
          ENABLE_PWA: 'true'
          # Custom domain (CNAME www.eliteagrocloud.com) is served at the domain root, so build with base "/".
          VITE_BASE_PATH: '/'
          VITE_APP_CANONICAL_URL: 'https://www.eliteagrocloud.com/'
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          # Public, URL-restricted Mapbox token embedded for the static deploy (set repo Variable VITE_MAPBOX_TOKEN).
          # Empty when unset → token-free build (unchanged behavior). Restrict the token to www.eliteagrocloud.com in Mapbox.
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          # Hostinger Node that serves /api/* (GitHub Pages has no backend).
          VITE_AGRI_API_SECRETS_URL: ${{ vars.VITE_AGRI_API_SECRETS_URL || 'https://api.eliteagrocloud.com' }}
          VITE_GOOGLE_MAPS_API_KEY: ''
          VITE_GOOGLE_MAPS_SERVER_API_KEY: ''
          VITE_ARCGIS_PORTAL_TOKEN: ''
          VITE_SENTINEL_HUB_WMS_INSTANCE_ID: ''
          VITE_SENTINEL_HUB_ACCESS_TOKEN: ''
          VITE_SENTINEL_HUB_CLIENT_ID: ''
          VITE_SENTINEL_HUB_CLIENT_SECRET: ''
          VITE_CDSE_CLIENT_ID: ''
          VITE_CDSE_CLIENT_SECRET: ''
          VITE_GEMINI_API_KEY: ''
          VITE_OPENAI_API_KEY: ''
          VITE_CLAUDE_API_KEY: ''
          VITE_DEEPSEEK_API_KEY: ''
          VITE_OPENWEATHER_API_KEY: ''
          VITE_OPENROUTESERVICE: ''
          VITE_DROPBOX_APP_KEY: ''
          VITE_ONEDRIVE_CLIENT_ID: ''
          VITE_GOOGLE_DRIVE_CLIENT_ID: ''
          VITE_GOOGLE_DRIVE_API_KEY: ''
        run: npm run build
      - name: Prepare Pages dist + sanity-check
        env:
          # Allow the intentionally-public, URL-restricted Mapbox token through the embedded-secret scanner.
          PAGES_SECRET_SCAN_ALLOW: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: node scripts/pages-dist-check.mjs
      - name: Publish build to docs/ and push main
        run: |
          set -euo pipefail
          node scripts/publish-pages-docs.mjs --git-add
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No SPA changes to publish."
          else
            git commit -m "chore(pages): publish SPA build to docs [pages-sync]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Serve Pages from main /docs (after docs/ is pushed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          PAGES_SOURCE_PATH: /docs
        run: node scripts/ensure-pages-branch-source.mjs
      - name: Remove legacy root build (one-time migration)
        run: |
          set -euo pipefail
          node scripts/remove-legacy-pages-root.mjs --git
          if git diff --cached --quiet; then
            echo "Repository root already clean."
            exit 0
          fi
          git commit -m "chore(pages): remove legacy root SPA build [pages-sync]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Drop legacy gh-pages branch (optional)
        continue-on-error: true
        run: git push origin --delete gh-pages
      - name: Summary
        run: |
          {
            echo "## GitHub Pages (main / docs)"
            echo "Build published to \`main:/docs\` (no local .env secrets). Pages: **Deploy from a branch** → **main** → **/docs**."
            echo ""
            echo "| App |"
            echo "| --- |"
            echo "| [https://www.eliteagrocloud.com/#/](https://www.eliteagrocloud.com/#/) |"
            echo ""
            echo "**HTTPS:** Provided by GitHub Pages. **PWA:** enabled when \`ENABLE_PWA=true\`."
            echo ""
            echo "**Next:** [Production health check](https://github.com/${{ github.repository }}/actions/workflows/production-health.yml) runs after this workflow."
            echo ""
            echo "See [core/docs/DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/main/core/docs/DEPLOYMENT.md) for full-stack API hosting."
          } >> "$GITHUB_STEP_SUMMARY"
