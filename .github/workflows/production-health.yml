name: Production health check

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live SPA shell
        run: |
          set -euo pipefail
          URL="https://www.eliteagrocloud.com/"
          HTML=$(curl -fsSL "$URL")
          echo "$HTML" | grep -q 'id="root"' || { echo "Missing #root in index.html"; exit 1; }
          echo "$HTML" | grep -qE '(AgroCloud/)?assets/index-[^"]+\.js' || { echo "Missing built JS bundle reference"; exit 1; }
          echo "Production SPA smoke check passed for $URL"

      - name: Check API health (api.eliteagrocloud.com)
        continue-on-error: true
        run: |
          set -euo pipefail
          API="https://api.eliteagrocloud.com"
          curl -fsS "${API}/api/health" | grep -q '"ok"'
          curl -fsS "${API}/api/agri-field-boundary/health" | grep -q '"status"'
          echo "API smoke check passed for ${API}"
