<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Avoid stale GitHub Pages / SW shell (old “Opening…” bootstrap) being shown from disk cache. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      ;(function () {
        try {
          var h = typeof location !== 'undefined' ? String(location.hostname || '') : ''
          if (h.indexOf('github.io') === -1) return
          var curEl = document.querySelector('meta[name="agro-pages-build"]')
          var cur = curEl && curEl.getAttribute('content')
          if (!cur) return
          var path = location.pathname || '/'
          if (path.indexOf('?') !== -1) path = path.split('?')[0]
          var probe = path + (path.slice(-1) === '/' ? '' : '/') + '?agroShellProbe=' + Date.now()
          fetch(probe, { cache: 'no-store', credentials: 'same-origin' })
            .then(function (r) {
              return r.text()
            })
            .then(function (html) {
              var m = String(html).match(/name=["']agro-pages-build["']\s+content=["']([^"']+)["']/i)
              var live = m && m[1]
              if (!live || live === cur) return
              var k = 'agro_shell_stale_' + live
              if (sessionStorage.getItem(k) === '1') {
                var u = new URL(location.href)
                u.searchParams.set('agroBust', String(Date.now()))
                sessionStorage.removeItem(k)
                location.replace(u.toString())
                return
              }
              sessionStorage.setItem(k, '1')
              location.reload()
            })
            .catch(function () {})
        } catch (_) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: dark)" />
    <script>
      ;(function () {
        try {
          var touch =
            window.matchMedia('(pointer: coarse)').matches ||
            /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
          if (touch) document.documentElement.classList.add('agro-touch')
          if (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          ) {
            document.documentElement.classList.add('agro-standalone')
          }
        } catch (_) {}
      })()
    </script>
    <meta name="description" content="AgroCloud frontend for agricultural management and satellite/GIS workflows." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgroCloud" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <title>Elite AgroCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <script>
      (function () {
        if (window.location.protocol === 'file:') {
          window.location.replace('http://localhost:5174/AgroCloud/');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
