# One-command AI Tree Detection service (Ultralytics YOLO detect).
#
#   cd backend/services/tree-detection
#   docker compose up --build
#
# Serves YOLO Detection (class `tree`) on http://localhost:8080/predict —
# AgroCloud default TREE_DETECTION_URL. GIS client maps box centres to points.
services:
  tree-detection:
    build: .
    image: ai-tree-detection
    ports:
      - "8080:8080"
    environment:
      TREE_DETECTION_ENGINE: yolo
      TREE_DETECTION_YOLO_WEIGHTS: yolov8s-worldv2.pt
      TREE_DETECTION_CONF: "0.25"
      TREE_DETECTION_IOU: "0.45"
      # Optional custom single-class tree weights:
      # MODEL_PATH: /models/tree.pt
    volumes:
      - tree-detection-cache:/root/.cache
      # - /path/to/tree.pt:/models/tree.pt:ro
    restart: unless-stopped

volumes:
  tree-detection-cache:
