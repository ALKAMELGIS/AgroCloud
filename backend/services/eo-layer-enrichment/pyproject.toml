[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrocloud-eo-enrichment"
version = "1.0.0"
description = "Enrich agricultural vector layers with Sentinel-2 Earth Observation attributes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "fiona>=1.9.0",
  "pyproj>=3.6.0",
  "rasterio>=1.3.0",
  "rioxarray>=0.15.0",
  "xarray>=2024.1.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "rasterstats>=0.19.0",
  "pystac-client>=0.7.0",
  "planetary-computer>=1.0.0",
  "stackstac>=0.5.0",
  "scikit-learn>=1.3.0",
  "openpyxl>=3.1.0",
  "tqdm>=4.66.0",
  "click>=8.1.0",
  "lxml>=4.9.0",
  "requests>=2.31.0",
]

[project.scripts]
eo-enrich = "eo_enrichment.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eo_enrichment*"]
